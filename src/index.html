<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="attr-req-value "
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main
      class="card"
      data-qa="card"
    >
      <section class="product">
        <img
          src="./images/imac.jpeg"
          class="product__image"
          alt="img-req-alt"
        />
      </section>

      <section class="description">
        <div class="description__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </div>
        <div class="description__code">Product code: 195434</div>

        <section class="reviews">
          <div class="stars stars__stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <span class="reviews__count">Reviews: 5</span>
        </section>

        <section class="price">
          <div class="price__label">Price:</div>
          <span class="price__value">$2,199</span>
        </section>

        <a
          href="#"
          class="button"
          data-qa="hover"
        >
          Buy
        </a>
      </section>
    </main>
  </body>
</html>
